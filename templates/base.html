<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" href="{{ root }}/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}/assets/style.css">
<link rel="stylesheet" href="{{ root }}/assets/highlight.css">
</head>
<body>
<nav class="site-nav">
  <div class="nav-inner">
    <a class="logo" href="{{ root }}/">
      <span class="logo-prompt">❯</span><span class="logo-name">{{ site.title }}</span>
    </a>
    <div class="nav-links">
      <a href="{{ root }}/">文章</a>
      <a href="{{ root }}/archive/">归档</a>
      <a href="{{ root }}/tags/">标签</a>
      <a href="{{ root }}/search/">搜索</a>
      {% for page in nav_pages %}
      <a href="{{ root }}/{{ page.url }}">{{ page.title }}</a>
      {% endfor %}
    </div>
  </div>
</nav>

<main class="container">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-status"><i class="dot"></i> © {{ site.since }} {{ site.author }} · {{ site.title }}</span>
    <span class="footer-links">
      {% if social.github %}<a href="{{ social.github }}" rel="noopener" target="_blank">github</a>{% endif %}
      {% if social.email %}<a href="mailto:{{ social.email }}">email</a>{% endif %}
    </span>
  </div>
</footer>
</body>
</html>
