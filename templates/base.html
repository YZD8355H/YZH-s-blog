<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block meta_desc %}{{ site.description }}{% endblock %}">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="{{ root }}/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}/assets/style.css">
<link rel="stylesheet" href="{{ root }}/assets/highlight.css">
</head>
<body>
<div id="scroll-progress"></div>
<nav class="site-nav">
  <div class="nav-inner">
    <a class="logo" href="{{ root }}/">
      <span class="logo-prompt">❯</span><span class="logo-name">{{ site.title }}</span>
    </a>
    <div class="nav-links">
      <a href="{{ root }}/" {% if nav_current == 'index' %}class="active"{% endif %}>文章</a>
      <a href="{{ root }}/archive/" {% if nav_current == 'archive' %}class="active"{% endif %}>归档</a>
      <a href="{{ root }}/tags/" {% if nav_current == 'tags' %}class="active"{% endif %}>标签</a>
      <a href="{{ root }}/search/" {% if nav_current == 'search' %}class="active"{% endif %}>搜索</a>
      {% for page in nav_pages %}
      <a href="{{ root }}/{{ page.url }}" {% if nav_current == page.slug %}class="active"{% endif %}>{{ page.title }}</a>
      {% endfor %}
    </div>
  </div>
</nav>

<main class="{% block main_class %}container{% endblock %}">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">© {{ site.since }} {{ site.author }}</span>
    <span class="footer-links">
      {% if social.github %}<a href="{{ social.github }}" rel="noopener" target="_blank">github</a>{% endif %}
      {% if social.email %}<a href="mailto:{{ social.email }}">email</a>{% endif %}
    </span>
  </div>
</footer>
<button id="back-top" aria-label="回到顶部" title="回到顶部">↑ top</button>
<script src="{{ root }}/assets/terminal.js"></script>
</body>
</html>
