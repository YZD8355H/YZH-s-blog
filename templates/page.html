{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ site.title }}{% endblock %}

{% block content %}
<article class="page">
  <header class="page-head">
    <div class="term-line"><span class="term-prompt">~ ❯</span> cat {{ page.slug }}.md</div>
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  <div class="page-body">
    {{ page.html | safe }}
  </div>
</article>
{% endblock %}
